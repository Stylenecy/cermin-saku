[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
bsc = "${BSC_RPC}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
